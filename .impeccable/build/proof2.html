<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Chivo:wght@900&family=Barlow:wght@900&family=Kanit:wght@800&family=Saira:wght@900&family=Anton&display=swap" rel="stylesheet">
<style>
body{background:#fff;margin:0;padding:10px;font-size:0}
img{width:1000px;display:block;margin-bottom:6px}
.row{margin:0;height:150px;position:relative;white-space:nowrap}
.s{display:inline-block;font-size:120px;line-height:1.25;text-transform:uppercase;transform-origin:left center;color:#111}
.n{font:600 11px monospace;color:#777}
</style></head><body>
<img src="file:///home/antoniohh/Proyectos/Tuanbyte/.impeccable/build/brand-wm.png">
<div id="rows"></div>
<script>
const cands=[["Archivo Black","'Archivo Black',sans-serif",400],["Chivo 900","Chivo,sans-serif",900],["Barlow 900","Barlow,sans-serif",900],["Kanit 800","Kanit,sans-serif",800],["Saira 900","Saira,sans-serif",900],["Anton","Anton,sans-serif",400]];
const rows=document.getElementById('rows');
for(const [n,f,w] of cands){
  const wrap=document.createElement('div');
  wrap.innerHTML=`<div class="n">${n}</div><div class="row"><span class="s" style="font-family:${f};font-weight:${w}">TUANBYTE</span></div>`;
  rows.appendChild(wrap);
}
document.fonts.ready.then(()=>{
  document.querySelectorAll('.s').forEach(el=>{
    const wpx=el.getBoundingClientRect().width;
    el.style.transform='scale('+(1000/wpx)+')';
  });
});
</script></body></html>
