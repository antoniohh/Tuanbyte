name: Deploy a GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Programado a primera hora (00:36 UTC = 01:36 CET invierno / 02:36 CEST verano)
    # para compensar el retardo de colas de GitHub Actions (~6-7 h) y desplegar sobre las 07:45 - 08:30 AM
    - cron: "36 0 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
